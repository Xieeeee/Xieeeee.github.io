  - years: "2024–2025"
    org: University of California San Diego
    role: Postdoctoral Research Associate
    bullets:
      - "Led data analysis across multi-investigator projects in the NIH 4D Nucleome Program, dissecting gene regulatory mechanisms in heart failure and MASLD/MASH."
      - "Identified cardiomyocyte-specific erosion of chromatin compartmentalization in human heart failure, and uncovered etiology-specific transcription factors driving progression in cardiomyocytes and fibroblasts."
      - "Showed that simple steatosis and steatohepatitis are governed by distinct transcriptional programs, and linked major MASH risk loci to putative effector genes."
    collaborators:
      - Luca Tucciarone
      - Elie Farah
      - Weston Elison

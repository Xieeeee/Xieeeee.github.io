      - Stavros Drakos
      - David Brenner

  - years: "2021–2024"
    org: University of California San Diego
    role: "Graduate Student Researcher · Ren Lab"
    bullets:
      - "Developed <strong>Droplet Paired-Tag</strong>, a high-throughput single-cell multiomic method profiling histone modifications and transcriptomes together; applied it to annotate cell-type-specific chromatin states and regulatory elements in mouse cortex."
      - "Co-developed <strong>Droplet Hi-C</strong> and extended it to <strong>Paired Hi-C</strong>, characterizing structural-variant heterogeneity in cancer models and dynamic ecDNA evolution in glioblastoma under drug resistance."
    collaborators:

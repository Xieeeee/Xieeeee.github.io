experience:
  - years: "2025–"
    current: true
    org: New York Genome Center
    role: Postdoctoral Research Associate
    bullets:
      - "Led the pilot study for the $100M Center for Multiomic Human Brain Cell Atlas (NIH BRAIN Initiative), establishing feasibility and analytical frameworks for large-scale multimodal profiling."
      - "Discovered that repressive histone modifications encode epigenetic memory, shaping cell-type-, region-, and species-specific gene regulatory programs across the human brain."
      - "Authored multiple manuscripts on single-cell integrative analyses of the mammalian brain, focused on active and repressive histone modifications."
    collaborators:
